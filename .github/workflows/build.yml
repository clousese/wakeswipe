name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build APK
        run: bash build.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wakeswipe-apk
          path: out/wakeswipe-debug.apk
